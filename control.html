<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel Guziecson</title><link rel="stylesheet" href="style.css"></head><body><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="config.js"></script><script src="app.js"></script>
<div id="loginView" class="wrap login"><section class="card"><h2>🔐 Panel Guziecson</h2><p>Zaloguj się kontem administratora Firebase.</p><label>E-mail<input id="email" type="email" autocomplete="username"></label><label style="margin-top:12px">Hasło<input id="password" type="password" autocomplete="current-password"></label><button style="margin-top:18px" onclick="login()">ZALOGUJ</button><p id="loginStatus"></p></section></div>
<main id="panelView" class="wrap" style="display:none"><h1>Panel <em>Guziecson 90</em></h1><p><span class="status-ok">● ZALOGOWANO</span> jako <b id="who"></b> <button class="secondary" onclick="firebase.auth().signOut()">WYLOGUJ</button></p>
<section class="card"><h2>1. Gra skończona → kliknij miejsce</h2><p id="currentExercise"></p><div class="gamebuttons" id="gb"></div><p>Dzisiejsze REP: <span class="big" id="reps"></span></p><p>AVG: <b id="avg"></b> • Gry: <b id="games"></b></p><button class="secondary" onclick="G90.undoGame()">COFNIJ OSTATNIĄ GRĘ</button></section>
<section class="grid"><div class="card"><h2>2. Przysiady</h2><p class="big" id="squats"></p><button onclick="G90.addSquats(10)">+10</button><button onclick="G90.addSquats(21)">+21</button><button onclick="G90.addSquats(54)">+54</button></div><div class="card"><h2>3. Donejty</h2><label>Łączna kwota dziś (PLN)<input id="don" type="number" step=".01" min="0"></label><button onclick="saveDonations()">ZAPISZ</button></div></section>
<section class="card"><h2>4. Dane projektu</h2><div class="formgrid"><label>Dzień<input id="day" type="number" min="1" max="90"></label><label>Waga kg<input id="weight" type="number" step=".1"></label><label>Notatka<textarea id="notes"></textarea></label></div><button onclick="saveMeta()">ZAPISZ DANE</button></section>
<section class="card"><h2>5. Końcówka streama</h2><div id="summary" class="big">—</div><button onclick="finishPreview()">WYLICZ BIEG NA KONIEC STREAMA</button><button class="danger" onclick="if(confirm('Zapisać stream i przejść do kolejnego dnia?')) G90.nextDay()">ZAPISZ STREAM + NASTĘPNY DZIEŃ</button></section>
<section class="card"><h2>⚠️ Reset</h2><button class="secondary" onclick="if(confirm('Zresetować dzisiejszy stream?')) G90.resetStream()">RESET DZISIEJSZEGO STREAMA</button><button class="danger" onclick="if(confirm('UWAGA: usunąć CAŁY progress projektu?')) G90.resetProject()">RESET CAŁEGO PROJEKTU</button></section></main>
<script>
for(let i=1;i<=8;i++){let b=document.createElement("button");b.textContent=i;b.onclick=()=>G90.addGame(i);gb.appendChild(b)}
firebase.auth().onAuthStateChanged(user=>{loginView.style.display=user?"none":"block";panelView.style.display=user?"block":"none";if(user)who.textContent=user.email||user.uid;});
async function login(){loginStatus.textContent="Logowanie...";try{await firebase.auth().signInWithEmailAndPassword(email.value,password.value);loginStatus.textContent="";}catch(e){loginStatus.className="status-bad";loginStatus.textContent="Błąd logowania: "+e.message;}}
function setIfNotEditing(el, value){
  if(document.activeElement !== el) el.value = value ?? "";
}
function render(){
  let st=G90.state,e=G90.exercise(),av=G90.avg();
  currentExercise.innerHTML=`<b>${e.label} — ${e.name}</b> • mnożnik ×${e.multiplier}`;
  reps.textContent=G90.reps();
  avg.textContent=av===null?"—":av.toFixed(2);
  games.textContent=st.games.length;
  squats.textContent=(st.squats||0)+" / 100";

  setIfNotEditing(don, st.donationsPLN||0);
  setIfNotEditing(day, st.day);
  setIfNotEditing(weight, st.weight||"");
  setIfNotEditing(notes, st.notes||"");
}
async function saveMeta(){
  G90.state.day = Number(day.value)||1;
  G90.state.weight = weight.value ? Number(weight.value) : null;
  G90.state.notes = notes.value;
  await G90.save();
}
async function saveDonations(){
  G90.state.donationsPLN = Number(don.value)||0;
  await G90.save();
}
function finishPreview(){let av=G90.avg();summary.innerHTML=av===null?"Brak gier.":`AVG ${av.toFixed(2)} → ${G90.foodFor(av)} jutro • BIEG: ${(G90.finalRun()/1000).toFixed(1)} KM`;}
addEventListener("g90update",render);
</script></body></html>
