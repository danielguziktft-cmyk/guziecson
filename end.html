<!doctype html><html lang="pl"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="config.js"></script><script src="app.js"></script><main class="wrap"><section class="card" style="text-align:center;margin-top:80px"><div class="eyebrow">KOŃCÓWKA STREAMA</div><h1>RAPORT <em>GUZIECSONA</em></h1><div class="triple"><div class="stat"><b id="a"></b><small>AVG</small></div><div class="stat"><b id="r"></b><small>REP</small></div><div class="stat"><b id="s"></b><small>PRZYSIADY</small></div></div><h2>🏃 BIEG NA KONIEC STREAMA</h2><div class="big" id="run"></div><p id="breakdown"></p><h2>🥣 NA NASTĘPNYM STREAMIE</h2><div class="big" id="food"></div></section></main><script>function render(){let av=G90.avg();a.textContent=av===null?"—":av.toFixed(2);r.textContent=G90.reps();s.textContent=(G90.state.squats||0)+"/100";run.textContent=(G90.finalRun()/1000).toFixed(1)+" KM";breakdown.textContent=`AVG: ${(G90.avgRunMeters(av)/1000).toFixed(1)} km + donejty: ${(G90.donationMeters()/1000).toFixed(1)} km, limit 3.0 km`;food.textContent=G90.foodFor(av)||"—";}addEventListener("g90update",render);</script></body></html>
